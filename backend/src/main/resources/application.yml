# Nenhum segredo aqui: tudo sensível vem de variável de ambiente.
spring:
  application:
    name: exivamoeres

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/exivamoeres}
    username: ${POSTGRES_USER:exivamoeres}
    password: ${POSTGRES_PASSWORD}

  jpa:
    # O schema é do Flyway; o Hibernate só valida que entidade e banco batem.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          # Os defaults "placeholder" existem só pra aplicação subir em dev
          # sem credenciais OAuth — o login social falha apenas se for usado.
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder-secret}
            scope: [openid, profile, email]
          discord:
            client-id: ${DISCORD_CLIENT_ID:placeholder-client-id}
            client-secret: ${DISCORD_CLIENT_SECRET:placeholder-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/discord"
            scope: [identify, email]
        provider:
          # Discord não é um provider conhecido do Spring, então os endpoints
          # são declarados manualmente.
          discord:
            authorization-uri: https://discord.com/oauth2/authorize
            token-uri: https://discord.com/api/oauth2/token
            user-info-uri: https://discord.com/api/users/@me
            user-name-attribute: id

server:
  port: 8080
  # Railway (e proxies reversos em geral) terminam TLS e encaminham a
  # requisição em HTTP puro internamente, sinalizando o scheme original via
  # X-Forwarded-Proto/-Host/-Port. Sem confiar nesses headers, o Spring monta
  # o redirect_uri do OAuth2 ({baseUrl}) como http://, causando
  # redirect_uri_mismatch no Google/Discord em produção.
  forward-headers-strategy: framework

# ----- Configurações próprias da aplicação -----
app:
  jwt:
    # HMAC-SHA, mínimo de 64 bytes. Gere com: openssl rand -base64 64
    secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:14}
  cors:
    # Nunca "*": só a origem real do frontend.
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}
  oauth2:
    # Após login social o backend redireciona pra cá com o token no fragmento.
    redirect-url: ${OAUTH2_REDIRECT_URL:http://localhost:5173/oauth/callback}
  tibiadata:
    base-url: ${TIBIADATA_BASE_URL:https://api.tibiadata.com}
  claim:
    # Intervalo do polling de verificação (regra de negócio: 15 minutos)
    poll-interval: ${CLAIM_POLL_INTERVAL:15m}
    # Claim não verificado em 24h expira
    expiration-hours: 24
  cache:
    # TTL da checagem de elegibilidade (world + Free/Premium) por personagem.
    character-eligibility-ttl: ${CHARACTER_ELIGIBILITY_CACHE_TTL:1h}
    worlds-ttl: ${WORLDS_CACHE_TTL:24h}
  character:
    # Refresh periódico do level (exibição). Custo mínimo: só personagens em
    # time ativo e cujo retrato local já passou de 'level-staleness' são
    # rebuscados na TibiaData, em lotes espaçados.
    level-refresh-interval: ${CHARACTER_LEVEL_REFRESH_INTERVAL:1h}
    level-staleness: ${CHARACTER_LEVEL_STALENESS:12h}
    level-refresh-batch-size: ${CHARACTER_LEVEL_REFRESH_BATCH_SIZE:15}
    level-refresh-spacing: ${CHARACTER_LEVEL_REFRESH_SPACING:2s}
  team:
    max-members: 5
    # Quantos times ATIVOS uma conta free pode manter ao mesmo tempo.
    free-active-limit: ${TEAM_FREE_ACTIVE_LIMIT:3}
    # Prazo de vida de um time por plano (dias) — free menor que premium.
    free-duration-days: ${TEAM_FREE_DURATION_DAYS:7}
    premium-duration-days: ${TEAM_PREMIUM_DURATION_DAYS:30}
    # Frequência do job que arquiva times expirados.
    expiration-check-interval: ${TEAM_EXPIRATION_CHECK_INTERVAL:1h}
    # Personagens isentos da exigência de Premium Account (admin/testes).
    # Lista separada por vírgula. Vazio = regra vale para todos.
    premium-bypass-characters: ${TEAM_PREMIUM_BYPASS_CHARACTERS:}
  actuator:
    # Token do coletor de métricas (header X-Actuator-Token). Vazio = ninguém
    # acessa /actuator além do health — nem usuário logado. Gere com:
    # openssl rand -base64 32
    token: ${ACTUATOR_TOKEN:}
  chat:
    # Rate limit de mensagens por usuário (mensagens por minuto).
    messages-per-minute: ${CHAT_MESSAGES_PER_MINUTE:20}
  retention:
    # Limpeza das duas tabelas que cresciam sem teto (S8). Diário basta: o volume
    # de um dia é pequeno, e o job só apaga o que já passou da janela.
    interval: ${RETENTION_INTERVAL:24h}
    # Carência DEPOIS do vencimento do refresh token (que vive refresh-token-days).
    # Não é zero de propósito: token revogado é o sinal de reuso (S7) — enquanto o
    # registro existe, a tentativa é recusada com `reason=revoked userId=N`; sem
    # ele, vira `unknown_token`, sem dono.
    expired-refresh-token-days: ${RETENTION_REFRESH_TOKEN_DAYS:30}
    # Só notificações LIDAS. Não-lida nunca é apagada: é algo que a pessoa não viu.
    read-notification-days: ${RETENTION_READ_NOTIFICATION_DAYS:90}
  rate-limit:
    # Por IP (RateLimitFilter): login/registro e criação de conta anônima.
    # Conta anônima é ação rara para um humano e cara para o produto (cada uma
    # cria times na busca pública), por isso o limite é bem mais apertado.
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
    anonymous-per-hour: ${RATE_LIMIT_ANONYMOUS_PER_HOUR:3}
    # Por usuário (UserRateLimiter): o limite de times ATIVOS do plano não
    # impede criar-encerrar-criar em loop, e todo claim/entrada em time consulta
    # a TibiaData.
    team-creation-per-hour: ${RATE_LIMIT_TEAM_CREATION_PER_HOUR:10}
    tibiadata-per-hour: ${RATE_LIMIT_TIBIADATA_PER_HOUR:20}
    # Edições de time por hora, por usuário. O motivo não é o custo da escrita:
    # mudar horário/level mínimo NOTIFICA todos os membros aprovados, então sem
    # teto o dono consegue encher o sino dos outros.
    team-update-per-hour: ${RATE_LIMIT_TEAM_UPDATE_PER_HOUR:20}

resilience4j:
  retry:
    instances:
      tibiadata:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      tibiadata:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3

management:
  endpoints:
    web:
      exposure:
        # Só health por padrão: métricas entregam volume de usuários, rotas mais
        # chamadas, taxa de erro e o mapa interno da aplicação — reconhecimento
        # de graça. Ligar 'metrics,prometheus' aqui só faz sentido junto com o
        # ACTUATOR_TOKEN abaixo; sem ele o SecurityConfig recusa tudo fora do
        # health, mesmo para usuário logado.
        include: ${ACTUATOR_ENDPOINTS:health}
  endpoint:
    health:
      # 'when-authorized' era enganoso: o health é público (healthcheck do
      # Railway), então "autorizado" incluía qualquer conta — e o detalhe conta
      # status do banco e do disco. Público não detalha.
      show-details: never
  metrics:
    tags:
      # Tag em TODA métrica. Existe porque um coletor gratuito (Grafana Cloud e
      # afins) costuma receber séries de mais de um projeto/ambiente: sem isto,
      # "a latência subiu" não diz de onde. `environment` vem do ambiente para
      # produção e dev não se misturarem no mesmo gráfico.
      application: exivamoeres
      environment: ${APP_ENVIRONMENT:dev}
    distribution:
      # Sem isto, `http_server_requests_seconds` só tem contagem e soma — dá
      # média, e média esconde exatamente o que se procura (a cauda). Percentis
      # do lado do cliente, não histograma: bem mais barato em número de séries,
      # que é o que aperta em free tier.
      # ⚠️ Percentil calculado na instância NÃO agrega entre réplicas. Com mais
      # de uma, troque por `percentiles-histogram: true` e calcule no Prometheus.
      percentiles:
        http.server.requests: 0.95,0.99
        tasks.scheduled.execution: 0.95

logging:
  level:
    com.exivamoeres: INFO
  pattern:
    # O id de correlação em toda linha, logo depois do nível. Sem isto o MDC existe e
    # ninguém vê: era o que faltava para saber **quais linhas são da mesma coisa** quando
    # há trabalho concorrente.
    #
    # São **três chaves**, uma por origem, e nunca mais de uma ao mesmo tempo:
    #
    #   requestId  → requisição HTTP (RequestIdFilter)   ex.: 067c7820-…
    #   jobRunId   → ciclo de job @Scheduled             ex.: job-3f9a1c22
    #   msgId      → mensagem do chat pelo WebSocket     ex.: msg-8b21d004
    #
    # Chaves separadas porque `requestId` significa "requisição HTTP" e misturar origens
    # nela faria o log mentir sobre o que é o quê (ver LogContext). O **prefixo** no valor
    # deixa a origem legível sem precisar saber qual `%X` imprimiu.
    #
    # O `:-` imprime vazio quando não há id — o caso do boot e de qualquer coisa fora
    # dessas três origens. Sem ele, o padrão imprimiria a chave literal nessas linhas.
    level: "%5p [%X{requestId:-}%X{jobRunId:-}%X{msgId:-}]"
