name: CI

# Roda em todo push para main e em toda pull request. A combinação cobre os dois
# fluxos do projeto: commit direto na main (o mais comum hoje) e revisão via PR.
on:
  push:
    branches: [main]
  pull_request:

# Um push novo cancela a execução anterior do mesmo branch: sem isso, uma
# sequência de commits enfileira builds que já nasceram obsoletos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# O workflow só lê o repositório — nenhum passo publica nada.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (mvn test)
    # ubuntu-latest já vem com Docker: os testes de integração sobem um Postgres
    # real via Testcontainers. Sem Docker, a suíte falha inteira.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Nenhuma variável de ambiente é necessária: os testes injetam o banco do
      # Testcontainers e o app.jwt.secret via @DynamicPropertySource
      # (backend/src/test/java/com/exivamoeres/integration/IntegrationTestBase.java).
      - name: Rodar a suíte de testes
        run: mvn -B --no-transfer-progress test

      # Quando o CI falha, o log do passo mostra o resumo; o relatório completo
      # (stack trace de cada teste) fica aqui para download.
      - name: Guardar os relatórios do Surefire
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (npm run build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Igual ao NODE_VERSION do netlify.toml: o CI tem que compilar na mesma versão
      # que o deploy. O piso hoje é do react-router 8 (`>=22.22.0`, declarado em
      # engines do package.json); '22' resolve sempre para o 22.x mais novo, que o
      # satisfaz. Fixar só o major é de propósito: patch de segurança do Node entra
      # sem precisar de commit.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci (e não npm install): instala exatamente o package-lock.json e
      # falha se ele estiver dessincronizado do package.json.
      - name: Instalar as dependências
        run: npm ci

      # T11: quem descobria vulnerabilidade de dependência era alguém lembrando de
      # rodar `npm audit`. O esperado hoje é **zero** (o S10 fechou os quatro avisos),
      # então dá para exigir zero sem manter allowlist — que é configuração invisível
      # justamente sobre o que não se quer esquecer.
      #
      # `moderate` e não `high`: os dois avisos do react-router que o S10 tratou eram
      # moderados, e `high` os deixaria passar. `low` fica de fora porque no
      # ecossistema npm é ruído com frequência.
      #
      # ⚠️ O custo é real: falha publicada numa dependência transitiva reprova o PR de
      # quem não a causou. É aceitável porque a correção é um upgrade, não uma
      # investigação. Se atrapalhar, a resposta é `continue-on-error: true` (avisa sem
      # travar) — nunca allowlist.
      - name: Conferir vulnerabilidades das dependências
        run: npm audit --audit-level=moderate

      # T5: testes de componente (Vitest + Testing Library). Rodam **antes** do
      # build porque são o passo mais rápido que reprova por motivo de produto —
      # validação de formulário, payload da criação, quem pode entrar num time.
      # Não precisam de backend nem de banco: a camada de `services/` é mockada.
      - name: Rodar os testes de componente
        run: npm test

      # O script "build" começa pelo `scripts/i18n-check.mjs` (T13): chave que existe
      # em um idioma e falta no outro reprova aqui, antes de o deploy publicar uma tela
      # com texto no idioma errado — ou com a chave crua à mostra. Depois vêm
      # `tsc -b` e `vite build`, os níveis 1 e 3 de verificação do TESTS.md.
      - name: Compilar o build de produção
        run: npm run build

  # ---------------------------------------------------------------------------
  # Testes de navegação: abrem cada página num Chromium real, contra o backend e
  # o banco de verdade. É o job mais caro do CI e o único que precisa de dois
  # processos de pé — por isso ele é um job separado, e não um passo do frontend.
  #
  # Roda em paralelo com os outros dois: nada aqui depende do resultado deles, e
  # serializar só faria o feedback demorar mais.
  # ---------------------------------------------------------------------------
  e2e:
    name: Navegação (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      # As credenciais têm que casar com o que o application.yml espera: o
      # DATABASE_URL padrão já aponta para localhost:5432/exivamoeres, então só a
      # senha precisa ser passada para o backend (POSTGRES_PASSWORD, abaixo).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: exivamoeres
          POSTGRES_USER: exivamoeres
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        # Sem o healthcheck, o backend sobe antes do banco aceitar conexão e o
        # Flyway falha no boot.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # -DskipTests de propósito: a suíte de backend é o job `backend`. Aqui o jar
      # é só o servidor que as páginas vão consultar — rodar 201 testes de novo
      # dobraria o tempo do CI sem cobrir nada novo.
      - name: Compilar o jar do backend
        working-directory: backend
        run: mvn -B --no-transfer-progress -DskipTests package

      # O suíte reprova qualquer requisição 4xx/5xx, e a home chama /api/worlds,
      # que no backend vira chamada de verdade à api.tibiadata.com. Sem o stub, o
      # job dependeria de uma API pública de terceiro estar de pé e não bloquear o
      # IP do runner — receita conhecida de job que falha sem culpa do código.
      - name: Subir o stub da TibiaData
        run: |
          python3 ops/ci/tibiadata-stub.py 8081 > tibiadata-stub.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf http://localhost:8081/health > /dev/null && exit 0
            sleep 1
          done
          echo "::error::o stub da TibiaData não subiu"; cat tibiadata-stub.log; exit 1

      - name: Subir o backend
        env:
          POSTGRES_PASSWORD: ci-postgres
          # >= 64 bytes (HMAC-SHA512). Valor de teste, público de propósito: este
          # backend só existe durante o job.
          JWT_SECRET: chave-de-ci-apenas-para-testes-0123456789-0123456789-0123456789
          FRONTEND_URL: http://localhost:5173
          TIBIADATA_BASE_URL: http://localhost:8081
          # O cache de sessão do suíte (e2e/.auth) começa vazio a cada execução,
          # então ele cria uma conta anônima — que é limitada a 3/hora por IP. Sem
          # este teto alto, a terceira execução da hora falharia por motivo que não
          # tem nada a ver com o código.
          RATE_LIMIT_ANONYMOUS_PER_HOUR: '100'
          # A tag `environment` de toda métrica (T7). 'ci' mantém as séries do CI
          # separadas de dev e de prod, caso um dia este job exporte métrica.
          APP_ENVIRONMENT: ci
        run: |
          java -jar backend/target/*.jar > backend.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health > /dev/null && exit 0
            sleep 2
          done
          echo "::error::o backend não respondeu em 120s"; tail -50 backend.log; exit 1

      # Cinco testes precisam de um time que exista (a página de detalhe e os dois
      # do ErrorBoundary). Num banco recém-criado eles pulariam em silêncio.
      # O psql vem da mesma imagem do serviço de banco, em vez do runner: não
      # depende de qual cliente o ubuntu-latest traz instalado hoje.
      - name: Semear o time de fixture
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=ci-postgres \
            -v "$PWD/ops/ci:/seed:ro" \
            postgres:16-alpine \
            psql -h localhost -U exivamoeres -d exivamoeres -f /seed/seed-e2e.sql

      - name: Instalar as dependências do frontend
        working-directory: frontend
        run: npm ci

      # Só o Chromium: é o único projeto configurado no playwright.config.ts, e
      # baixar os três navegadores custaria minutos por execução.
      - name: Instalar o Chromium do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # O próprio Playwright compila o frontend e sobe o `vite preview` na 5173
      # (webServer do playwright.config.ts).
      - name: Rodar os testes de navegação
        working-directory: frontend
        run: npm run test:e2e

      # O que torna uma falha remota investigável: o relatório tem screenshot e
      # trace de cada teste que reprovou, e o log do backend explica os 5xx.
      - name: Guardar o relatório e os logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend.log
            tibiadata-stub.log
          if-no-files-found: ignore
          retention-days: 7
