# Build e deploy do frontend no Netlify.
# Definir VITE_API_URL nas variáveis de ambiente do site (Netlify UI) apontando
# para a URL pública do backend no Railway.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# ⚠️ Node fixado de propósito. O Vite 7 exige "^20.19.0 || >=22.12.0", e sem
# esta linha o Netlify usa o default dele — que depende de quando o site foi
# criado e pode ser um 20.x anterior ao 20.19, quebrando o build só no deploy
# (o CI passaria). Manter igual ao node-version do .github/workflows/ci.yml.
[build.environment]
  NODE_VERSION = "22"

# ⚠️ Os cabeçalhos de segurança (CSP, X-Frame-Options, HSTS…) **não** estão aqui, e
# isso é de propósito: a CSP precisa liberar a origem do backend em `connect-src`, e
# essa origem é a variável VITE_API_URL — diferente entre local e produção. Fixá-la
# neste arquivo seria repetir a URL num segundo lugar e descobrir a divergência
# quando o chat parasse de conectar.
#
# Eles são gerados no build, em `dist/_headers`, a partir de
# `frontend/src/security/headers.ts` — a mesma função que configura o `vite preview`,
# o que permite à suíte de navegação rodar debaixo da política de verdade.
# Se VITE_API_URL não estiver definida, **o build falha** em vez de publicar um site
# com CSP quebrada.

# SPA: qualquer rota cai no index.html (o React Router resolve no cliente).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
